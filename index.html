<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Manager</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #17202a;
}

.header {
  background: #111827;
  color: white;
  padding: 20px;
  border-radius: 0 0 22px 22px;
}

.header h1 {
  font-size: 25px;
}

.header p {
  margin-top: 5px;
  color: #aeb8c5;
  font-size: 14px;
}

.container {
  padding: 18px;
  max-width: 600px;
  margin: auto;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: -5px;
}

.stat {
  background: white;
  padding: 18px;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.stat .number {
  font-size: 27px;
  font-weight: bold;
}

.stat .label {
  margin-top: 5px;
  color: #68717d;
  font-size: 13px;
}

.green { border-left: 5px solid #16a34a; }
.red { border-left: 5px solid #dc2626; }
.yellow { border-left: 5px solid #eab308; }
.blue { border-left: 5px solid #2563eb; }

.section-title {
  margin: 25px 0 12px;
  font-size: 19px;
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.menu button {
  border: none;
  background: white;
  padding: 20px 10px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: bold;
  color: #17202a;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.menu button:active {
  transform: scale(0.97);
}

.icon {
  display: block;
  font-size: 28px;
  margin-bottom: 8px;
}

.site-box {
  margin-top: 22px;
  background: white;
  padding: 18px;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.site-box h3 {
  margin-bottom: 8px;
}

.site-box p {
  color: #68717d;
  font-size: 14px;
}

.footer {
  text-align: center;
  padding: 30px 10px;
  color: #8a929c;
  font-size: 12px;
}
</style>
</head>

<body>

<header class="header">
  <h1>👷 SITE MANAGER</h1>
  <p>Manpower Management System</p>
</header>

<main class="container">

  <div class="stats">

    <div class="stat blue">
      <div class="number">0</div>
      <div class="label">Total Manpower</div>
    </div>

    <div class="stat green">
      <div class="number">0</div>
      <div class="label">Present Today</div>
    </div>

    <div class="stat red">
      <div class="number">0</div>
      <div class="label">Absent Today</div>
    </div>

    <div class="stat yellow">
      <div class="number">0</div>
      <div class="label">On Leave</div>
    </div>

  </div>

  <h2 class="section-title">Quick Actions</h2>

  <div class="menu">

    <button>
      <span class="icon">👷</span>
      Manpower
    </button>

    <button>
      <span class="icon">🟢</span>
      Attendance
    </button>

    <button>
      <span class="icon">⏱️</span>
      OT
    </button>

    <button>
      <span class="icon">💰</span>
      Advance
    </button>

    <button>
      <span class="icon">🏖️</span>
      Leave
    </button>

    <button>
      <span class="icon">💵</span>
      Salary
    </button>

    <button>
      <span class="icon">🏢</span>
      Sites
    </button>

    <button>
      <span class="icon">📊</span>
      Reports
    </button>

  </div>

  <h2 class="section-title">Current Site</h2>

  <div class="site-box">
    <h3>🏢 No Site Selected</h3>
    <p>Add your first site to start managing manpower.</p>
  </div>

</main>

<footer class="footer">
  SITE MANAGER • Manpower Management
</footer>

</body>
    </html>
