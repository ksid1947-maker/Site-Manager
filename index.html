<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Site Manager</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#17202a;
}
.header{
background:#111827;
color:white;
padding:22px 18px;
border-radius:0 0 22px 22px;
}
.header h1{font-size:28px}
.header p{margin-top:8px;color:#cbd5e1}

.container{padding:20px}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-bottom:28px;
}
.stat{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 12px #00000012;
}
.stat b{font-size:30px}
.stat p{margin-top:8px;color:#777}

h2{margin:20px 0 15px}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}
button{
border:0;
background:white;
padding:25px 10px;
border-radius:20px;
font-size:17px;
font-weight:bold;
box-shadow:0 4px 12px #00000012;
cursor:pointer;
}
button:active{transform:scale(.97)}

.icon{font-size:32px;display:block;margin-bottom:10px}

.current{
margin-top:25px;
background:white;
padding:22px;
border-radius:20px;
box-shadow:0 4px 12px #00000012;
}

.footer{
text-align:center;
margin:45px 0 15px;
color:#999;
}

#message{
position:fixed;
bottom:20px;
left:20px;
right:20px;
background:#111827;
color:white;
padding:15px;
border-radius:12px;
display:none;
text-align:center;
}
</style>
</head>

<body>

<div class="header">
<h1>👷 SITE MANAGER</h1>
<p>Manpower Management System</p>
</div>

<div class="container">

<div class="stats">

<div class="stat">
<b id="total">0</b>
<p>Total Manpower</p>
</div>

<div class="stat">
<b id="present">0</b>
<p>Present Today</p>
</div>

<div class="stat">
<b id="absent">0</b>
<p>Absent Today</p>
</div>

<div class="stat">
<b id="leave">0</b>
<p>On Leave</p>
</div>

</div>

<h2>Quick Actions</h2>

<div class="actions">

<button onclick="openPage('Manpower')">
<span class="icon">👷</span>
Manpower
</button>

<button onclick="openPage('Attendance')">
<span class="icon">🟢</span>
Attendance
</button>

<button onclick="openPage('Overtime')">
<span class="icon">⏱️</span>
OT
</button>

<button onclick="openPage('Advance')">
<span class="icon">💰</span>
Advance
</button>

<button onclick="openPage('Leave')">
<span class="icon">🏖️</span>
Leave
</button>

<button onclick="openPage('Salary')">
<span class="icon">💵</span>
Salary
</button>

<button onclick="openPage('Sites')">
<span class="icon">🏢</span>
Sites
</button>

<button onclick="openPage('Reports')">
<span class="icon">📊</span>
Reports
</button>

</div>

<h2>Current Site</h2>

<div class="current">
<h3>🏢 No Site Selected</h3>
<p style="margin-top:10px;color:#777">
Add your first site to start managing manpower.
</p>
</div>

<div class="footer">
SITE MANAGER • Manpower Management
</div>

</div>

<div id="message"></div>

<script>

function openPage(name){
const msg=document.getElementById("message");
msg.innerText=name+" section opened";
msg.style.display="block";

setTimeout(()=>{
msg.style.display="none";
},2000);
}

</script>

</body>
</html>
